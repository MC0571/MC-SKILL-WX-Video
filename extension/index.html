<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>视频号下载</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./agent.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <div class="page-title-row">
          <h1><img class="product-mark" src="./icons/wechat-channels.svg" alt="" aria-hidden="true">视频号下载</h1>
          <div class="header-actions">
            <a id="repository-link" class="repository-link" target="_blank" rel="noreferrer" title="喜欢这个插件？欢迎到 GitHub 点个 Star">
              <img src="./icons/github.svg" alt="" aria-hidden="true">
              <span>GitHub</span>
            </a>
            <button
              id="ai-download-prompt-open"
              class="secondary-button ai-prompt-launch"
              type="button"
              aria-haspopup="dialog"
              aria-controls="ai-download-prompt-popover"
              aria-expanded="false"
              popovertarget="ai-download-prompt-popover"
            >
              <span class="agent-launch-icons" aria-hidden="true">
                <img src="./icons/agents/chatgpt.svg" alt="">
                <img src="./icons/agents/claude-code.png" alt="">
                <img src="./icons/agents/workbuddy.svg" alt="">
              </span>
              <span>Agent 设置</span>
            </button>
          </div>
        </div>
        <p class="intro">粘贴公开分享链接，解析后预览并保存视频。</p>
      </header>

      <div
        id="ai-download-prompt-popover"
        class="ai-prompt-popover"
        popover="auto"
        role="dialog"
        aria-modal="false"
        aria-labelledby="ai-prompt-heading"
        aria-describedby="ai-prompt-description"
      >
        <div class="ai-prompt-heading-row">
          <h2 id="ai-prompt-heading">Agent 设置</h2>
        </div>
        <p id="ai-prompt-description" class="visually-hidden">
          检查完整提示词后，可复制并粘贴给 Agent；此面板不会自动执行下载。
        </p>
        <p id="bridge-connection-status" class="status bridge-connection-status" role="status" aria-live="polite" hidden></p>
        <p class="extension-version">扩展版本：<span id="extension-version">unknown</span></p>
        <p class="extension-version">当前浏览器连接标识：<span id="agent-instance-id">检查中</span>（用于区分多个 Chrome 用户，不是配对码）</p>
        <textarea id="ai-download-prompt-text" rows="12" readonly aria-label="提示词全文"></textarea>
        <p id="ai-prompt-copy-status" class="status ai-prompt-copy-status" role="status" aria-live="polite"></p>
        <button id="ai-download-prompt-copy" class="ai-prompt-copy" type="button" disabled>
          <img id="ai-download-prompt-copy-icon" src="./icons/copy.svg" alt="" aria-hidden="true">
          <span id="ai-download-prompt-copy-success" class="copy-success-icon" aria-hidden="true" hidden>✓</span>
          <span id="ai-download-prompt-copy-label">复制提示词</span>
        </button>
      </div>

      <div id="home-view">
      <section class="card input-card" aria-label="解析视频号分享链接">
        <form id="parse-form">
          <label class="visually-hidden" for="share-url">视频号分享链接</label>
          <div class="form-row">
            <input
              id="share-url"
              name="url"
              type="url"
              inputmode="url"
              autocomplete="url"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="https://weixin.qq.com/sph/..."
              required
            >
            <button id="parse-button" class="primary-button" type="submit">解析视频</button>
          </div>
        </form>
        <p id="parse-status" class="status" role="status" aria-live="polite"></p>
        <div class="input-notes">
          <p id="login-status" class="status login-status" role="status" aria-live="polite" hidden></p>
          <a id="yuanbao-login-link" class="login-link" href="https://yuanbao.tencent.com/" target="_blank" rel="noreferrer" hidden>打开元宝登录</a>
        </div>
      </section>

      <section id="result-card" class="card result-card" aria-labelledby="result-heading" hidden>
        <div class="result-heading">
          <h2 id="result-heading">视频信息</h2>
          <button id="download-button" class="primary-button" type="button" disabled>下载视频</button>
        </div>
        <div class="result-grid">
          <div class="media-column">
            <video id="preview-video" controls preload="metadata"></video>
            <section class="media-variants-panel" aria-labelledby="media-variants-heading">
              <h3 id="media-variants-heading">下载视频版本</h3>
              <ul id="media-variants" class="media-variants" aria-label="可下载视频版本"></ul>
            </section>
          </div>
          <aside class="result-details">
            <dl class="metadata">
              <div>
                <dt>标题</dt>
                <dd id="video-title"></dd>
              </div>
              <div>
                <dt>作者</dt>
                <dd id="video-author"></dd>
              </div>
            </dl>
            <img id="cover-image" class="cover-image" alt="视频封面" hidden>
          </aside>
        </div>
      </section>

      <section id="review-prompt" class="inline-review-prompt" aria-label="评价扩展" hidden>
        <a id="review-link" class="review-link" target="_blank" rel="noreferrer">如果这个插件对您有帮助，请给个 5 星好评吧，爱你呦💗</a>
        <div class="inline-actions">
          <button id="review-dismiss" class="text-button" type="button">不再提醒</button>
        </div>
      </section>

      <section class="card recent-downloads" aria-labelledby="recent-download-heading">
        <div class="section-heading-row">
          <h2 id="recent-download-heading">最近下载</h2>
          <button id="open-download-history" class="text-button" type="button">查看全部</button>
        </div>
        <div id="recent-download-list" class="download-history-list" aria-live="polite"></div>
        <p id="recent-download-empty" class="status history-empty" role="status" aria-live="polite" hidden></p>
        <p id="download-status" class="status recent-download-status" role="status" aria-live="polite"></p>
      </section>
      </div>

      <section id="history-view" class="history-view" aria-labelledby="history-heading" hidden>
        <div class="section-heading-row">
          <button id="history-back" class="text-button" type="button">返回解析</button>
          <h2 id="history-heading" tabindex="-1">下载记录</h2>
          <button id="history-order-toggle" class="text-button" type="button"></button>
        </div>
        <p id="history-status" class="status" role="status" aria-live="polite"></p>
        <div id="download-history-list"></div>
        <p id="download-history-empty" class="status history-empty" role="status" aria-live="polite" hidden></p>
        <button id="history-load-more" class="secondary-button history-load-more" type="button" hidden>加载更多</button>
      </section>

      <footer class="page-footer">
        <a id="privacy-link" target="_blank" rel="noreferrer">隐私政策</a>
        <a id="feedback-link" target="_blank" rel="noreferrer">问题与建议</a>
      </footer>
    </main>
  </body>
</html>
