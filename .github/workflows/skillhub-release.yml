name: SkillHub Release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/fix/skillhub-http400'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare the exact failed bundle and pinned official CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38732002534 --repo MC0571/weixin-channels-video --name skillhub-bundle --dir bundle
          curl -fsSL https://skillhub-1388575217.cos.ap-guangzhou.myqcloud.com/releases/skillhub-cli-2026.8.5.tar.gz -o "$RUNNER_TEMP/cli.tar.gz"
          echo "3bbe2ba15ada2eb7a94a2b760fead83be5f4164ab28a6c8b0944dbc539f7e236  $RUNNER_TEMP/cli.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/cli.tar.gz" -C "$RUNNER_TEMP"
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 "$RUNNER_TEMP/cli/skills_store_cli.py" publish bundle --dry-run --json
      - name: Reproduce once and encrypt the response
        env:
          SKILLHUB_KEY: ${{ secrets.SKILLHUB_KEY }}
          SKILLHUB_PUBLISHER: ${{ vars.SKILLHUB_PUBLISHER }}
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/cli/skills_store_cli.py"
          python3 "$cli" login --key "$SKILLHUB_KEY" --host https://api.skillhub.cn
          python3 "$cli" auth whoami --json | python3 scripts/skillhub-release.py identity
          status=0
          python3 "$cli" publish bundle --host https://api.skillhub.cn --changelog "自动发布 145035c7a090" --json > "$RUNNER_TEMP/raw.json" 2> "$RUNNER_TEMP/raw-stderr.txt" || status=$?
          openssl cms -encrypt -binary -aes256 -in "$RUNNER_TEMP/raw.json" -outform DER -out "$RUNNER_TEMP/diagnostic.enc" .github/skillhub-diagnostic-public.pem
          echo "CLI exit status: $status"
          exit "$status"
      - name: Delete raw response and credentials
        if: always()
        run: rm -f "$HOME/.skillhub/credentials.json" "$RUNNER_TEMP/raw.json" "$RUNNER_TEMP/raw-stderr.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: encrypted-skillhub-diagnostic
          path: ${{ runner.temp }}/diagnostic.enc
          retention-days: 1
